      text:"Your Chromebook freezes and your assignment will not load. What is the best first response?",
      choices:[
        { text:"Try a simple fix, then ask for help if the problem continues.", appropriate:true, points:{independence:1,problemSolving:1}, feedback:"Strong problem solving. You can try a basic step like refresh or restart, then ask for help if needed.", tags:["askedHelp","safeResponse"] },

        { text:"Give up on the assignment for the day.", appropriate:false, feedback:"Technology problems are frustrating, but they can often be fixed. Try one safe step and then ask for help." },
        { text:"Blame someone else for breaking it.", appropriate:false, feedback:"Blaming does not solve the technology problem. Focus on the next useful step." }

  finalChallenge: {
    title:"Falcon Brain Challenge",
    intro:"You are working on a difficult assignment. The Chromebook freezes. Another student is making noise nearby. You feel frustrated and restless. Choose the best steps in order.",
    steps:[
      {
        question:"Step 1: What should you do first?",
        choices:[
          { text:"Pause, notice your frustration, and choose a safe regulation step.", appropriate:true, points:{regulation:1}, feedback:"Good start. Regulation comes first because it helps your brain make a better next decision.", tags:["safeResponse"] },
          { text:"Yell at the other student.", appropriate:false, feedback:"That may increase the conflict. Start with a step that helps you get regulated first." },
          { text:"Hit the Chromebook.", appropriate:false, feedback:"That can damage the device. Start by getting regulated so you can problem-solve safely." },

const state = {
  name:"",
  scenarioIndex:0,
  currentRetries:0,
  firstAttemptCorrect:0,
  retryScenarioIds:[],
  completed:0,
  scores:{regulation:0,communication:0,independence:0,problemSolving:0},
  trackEnabled:true,
  trackCounts:{askedBreak:0,askedHelp:0,appropriateCommunication:0,safeResponse:0,createdSpace:0},
  challengeStep:0,
  challengeRetries:0,
  inChallenge:false
};

const screen = document.getElementById('screen');
const teacherOpenBtn = document.getElementById('teacherOpenBtn');

function esc(s){
  return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function renderWelcome(){
  screen.innerHTML = `
    <div class="center">
      <div class="scenario-tag">High School Skills Game</div>
      <h1>Falcon <span class="accent">Brain Quest</span></h1>
      <p>Practice real-life school choices for regulation, communication, independence, and problem solving.</p>
      <p class="small">No timer. Unlimited retries. Your goal is to practice useful choices.</p>
      <button class="btn btn-primary" id="startBtn">Start Quest</button>
    </div>`;
  document.getElementById('startBtn').onclick = renderName;
}

function renderName(){
  screen.innerHTML = `
    <h2>What should we call you?</h2>
    <p>Enter your first name or nickname.</p>
    <input id="nameInput" class="big-input" maxlength="20" placeholder="First name or nickname" autocomplete="off" />
    <button class="btn btn-primary" id="continueBtn">Continue</button>`;
  const input = document.getElementById('nameInput');
  input.focus();
  document.getElementById('continueBtn').onclick = () => {
    const value = input.value.trim();
    state.name = value || "Student";
    renderSkills();
  };
}

function renderSkills(){
  const boxes = Object.values(GAME.skills).map(skill => `
    <div class="skill-box"><h3>${esc(skill.label)}</h3><p>${esc(skill.description)}</p></div>`).join('');
  screen.innerHTML = `
    <h2>Your 4 Falcon Skills</h2>
    <p>You will earn points when your choice helps the situation.</p>
    <div class="grid">${boxes}</div>
    <button class="btn btn-primary" id="beginScenarios" style="margin-top:20px">Begin Scenarios</button>`;
  document.getElementById('beginScenarios').onclick = () => {
    state.scenarioIndex = 0;
    renderScenario();
  };
}

function getCurrentItem(){
  if(state.inChallenge) return GAME.finalChallenge.steps[state.challengeStep];
  return GAME.scenarios[state.scenarioIndex];
}

function renderScenario(){
  state.currentRetries = 0;
  state.inChallenge = false;
  const s = GAME.scenarios[state.scenarioIndex];
  const pct = Math.round((state.scenarioIndex/GAME.scenarios.length)*100);
  screen.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-label"><span>Scenario ${state.scenarioIndex+1} of ${GAME.scenarios.length}</span><span>${pct}%</span></div>
      <div class="progress"><div style="width:${pct}%"></div></div>
    </div>
    <div class="scenario-tag">${esc(s.title)}</div>
    <h2>${esc(s.text)}</h2>
    <div class="choice-grid" id="choices"></div>
    <div id="feedback"></div>`;
  renderChoices(s.choices, handleScenarioChoice);
}

function renderChoices(choices, handler){
  const wrap = document.getElementById('choices');
  wrap.innerHTML = '';
  choices.forEach((choice,i) => {
    const b = document.createElement('button');
    b.className = 'btn choice';
    b.textContent = choice.text;
    b.onclick = () => handler(choice, i);
    wrap.appendChild(b);
  });
}

function applyPoints(points={}){
  Object.entries(points).forEach(([k,v]) => { state.scores[k] += v; });
}

function applyTags(tags=[]){
  if(!state.trackEnabled) return;
  tags.forEach(tag => {
    if(tag in state.trackCounts) state.trackCounts[tag]++;
  });
}

function pointsText(points={}){
  return Object.entries(points).map(([k,v]) => `<span class="points-badge">+${v} ${esc(GAME.skills[k].label)}</span>`).join('');
}

function handleScenarioChoice(choice){
  const feedback = document.getElementById('feedback');
  if(choice.appropriate){
    applyPoints(choice.points);
    applyTags(choice.tags);
    if(state.currentRetries === 0) state.firstAttemptCorrect++;
    else if(!state.retryScenarioIds.includes(GAME.scenarios[state.scenarioIndex].id)) state.retryScenarioIds.push(GAME.scenarios[state.scenarioIndex].id);
    state.completed++;
    document.querySelectorAll('#choices button').forEach(b => b.disabled = true);
    feedback.innerHTML = `<div class="feedback good"><h3>Useful choice</h3><p>${esc(choice.feedback)}</p>${pointsText(choice.points)}<button class="btn btn-good" id="nextBtn" style="margin-top:12px">Next</button></div>`;
    document.getElementById('nextBtn').onclick = () => {
      if(state.scenarioIndex < GAME.scenarios.length - 1){
        state.scenarioIndex++;
        renderScenario();
      }else{
        renderChallengeIntro();
      }
    };
  } else {
    state.currentRetries++;
    feedback.innerHTML = `<div class="feedback retry"><h3>Try another choice</h3><p>${esc(choice.feedback)}</p><p class="small">You can retry as many times as you need.</p></div>`;
  }
}

function renderChallengeIntro(){
  state.inChallenge = true;
  state.challengeStep = 0;
  state.challengeRetries = 0;
  screen.innerHTML = `
    <div class="scenario-tag">Final Challenge</div>
    <h1>${esc(GAME.finalChallenge.title)}</h1>
    <p>${esc(GAME.finalChallenge.intro)}</p>
    <button class="btn btn-primary" id="challengeStart">Start Challenge</button>`;
  document.getElementById('challengeStart').onclick = renderChallengeStep;
}

function renderChallengeStep(){
  state.inChallenge = true;
  state.currentRetries = 0;
  const step = GAME.finalChallenge.steps[state.challengeStep];
  screen.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-label"><span>Falcon Brain Challenge</span><span>Step ${state.challengeStep+1} of ${GAME.finalChallenge.steps.length}</span></div>
      <div class="progress"><div style="width:${((state.challengeStep+1)/GAME.finalChallenge.steps.length)*100}%"></div></div>
    </div>
    <h2>${esc(step.question)}</h2>
    <div class="choice-grid" id="choices"></div>
    <div id="feedback"></div>`;
  renderChoices(step.choices, handleChallengeChoice);
}

function handleChallengeChoice(choice){
  const feedback = document.getElementById('feedback');
  if(choice.appropriate){
    applyPoints(choice.points);
    applyTags(choice.tags);
    document.querySelectorAll('#choices button').forEach(b => b.disabled = true);
    feedback.innerHTML = `<div class="feedback good"><h3>Useful choice</h3><p>${esc(choice.feedback)}</p>${pointsText(choice.points)}<button class="btn btn-good" id="nextChallenge" style="margin-top:12px">Continue</button></div>`;
    document.getElementById('nextChallenge').onclick = () => {
      if(state.challengeStep < GAME.finalChallenge.steps.length - 1){
        state.challengeStep++;
        renderChallengeStep();
      }else{
        renderResults();
      }
    };
  } else {
    state.currentRetries++;
    state.challengeRetries++;
    feedback.innerHTML = `<div class="feedback retry"><h3>Try another choice</h3><p>${esc(choice.feedback)}</p><p class="small">The challenge lets you retry without losing points.</p></div>`;
  }
}

function totalPoints(){return Object.values(state.scores).reduce((a,b)=>a+b,0)}
function strongestSkill(){
  return Object.entries(state.scores).sort((a,b)=>b[1]-a[1])[0][0];
}
function practiceSkill(){
  return Object.entries(state.scores).sort((a,b)=>a[1]-b[1])[0][0];
}
function achievement(){
  const total = totalPoints();
  return GAME.achievementLevels.filter(x => total >= x.min).slice(-1)[0].label;
}

function renderResults(){
  const strong = strongestSkill();
  const practice = practiceSkill();
  screen.innerHTML = `
    <div class="center">
      <div class="scenario-tag">Quest Complete</div>
      <h1>Great work, ${esc(state.name)}.</h1>
      <div class="level">${esc(achievement())}</div>
      <p>You practiced making safe, useful choices in real school situations.</p>
    </div>
    <div class="score-grid">
      ${scoreCard('Regulation',state.scores.regulation)}
      ${scoreCard('Communication',state.scores.communication)}
      ${scoreCard('Independence',state.scores.independence)}
      ${scoreCard('Problem Solving',state.scores.problemSolving)}
    </div>
    <div class="skill-box"><h3>Total Points: ${totalPoints()}</h3><p><strong>Strongest skill:</strong> ${esc(GAME.skills[strong].label)}<br><strong>Skill to practice:</strong> ${esc(GAME.skills[practice].label)}</p></div>
    <div class="button-row">
      <button class="btn btn-primary" id="teacherSummaryBtn">Teacher Summary</button>
      <button class="btn btn-secondary" id="restartBtn">Play Again</button>
    </div>`;
  document.getElementById('teacherSummaryBtn').onclick = renderTeacherSummary;
  document.getElementById('restartBtn').onclick = resetGame;
}

function scoreCard(label,score){
  return `<div class="score-card"><span>${esc(label)}</span><strong>${score}</strong></div>`;
}

function renderTeacherSummary(){
  const retryTitles = state.retryScenarioIds.map(id => GAME.scenarios.find(s=>s.id===id)?.title).filter(Boolean);
  const trackedRows = GAME.trackingOptions.map(t => `<tr><td>${esc(t.label)}</td><td>${state.trackCounts[t.key]}</td></tr>`).join('');
  screen.innerHTML = `
    <div class="scenario-tag">Teacher Summary</div>
    <h2>${esc(state.name)}</h2>
    <div class="teacher-panel">
      <div class="teacher-row"><span>Scenarios completed</span><strong>${state.completed} / ${GAME.scenarios.length}</strong></div>
      <div class="teacher-row"><span>Appropriate on first attempt</span><strong>${state.firstAttemptCorrect}</strong></div>
      <div class="teacher-row"><span>Scenarios requiring retry</span><strong>${state.retryScenarioIds.length}</strong></div>
      <div class="teacher-row"><span>Regulation Points</span><strong>${state.scores.regulation}</strong></div>
      <div class="teacher-row"><span>Communication Points</span><strong>${state.scores.communication}</strong></div>
      <div class="teacher-row"><span>Independence Points</span><strong>${state.scores.independence}</strong></div>
      <div class="teacher-row"><span>Problem-Solving Points</span><strong>${state.scores.problemSolving}</strong></div>
      <div class="teacher-row"><span>Total Points</span><strong>${totalPoints()}</strong></div>
    </div>
    <h3 style="margin-top:24px">Scenarios that required retries</h3>
    <div class="retry-list">${retryTitles.length ? `<ul>${retryTitles.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '<p>No scenario retries were needed.</p>'}</div>
    <h3 style="margin-top:24px">Optional IEP response counts</h3>
    <p class="small">These counts are based only on responses selected in this game. They are not a complete IEP data record.</p>
    <table class="track-table"><thead><tr><th>Tracked Response</th><th>Count</th></tr></thead><tbody>${trackedRows}</tbody></table>
    <div class="button-row">
      <button class="btn btn-secondary" id="backResults">Back to Results</button>
      <button class="btn btn-primary" id="printBtn">Print Summary</button>
    </div>`;
  document.getElementById('backResults').onclick = renderResults;
  document.getElementById('printBtn').onclick = () => window.print();
}

function renderTeacherSettings(){
  const checks = GAME.trackingOptions.map(t => `<label class="toggle"><input type="checkbox" data-track="${t.key}" ${state.trackEnabled ? 'checked' : ''}> <span>${esc(t.label)}</span></label>`).join('');
  screen.innerHTML = `
    <div class="scenario-tag">Teacher Controls</div>
    <h2>IEP Tracking</h2>
    <p>Turn response tracking on or off for this play session. Scenario content can be edited in the <strong>GAME</strong> section of the HTML file.</p>
    <label class="toggle"><input id="masterTrack" type="checkbox" ${state.trackEnabled ? 'checked' : ''}> <strong>Enable IEP response counting</strong></label>
    <div class="toggle-wrap" id="trackingList">${checks}</div>
    <button class="btn btn-secondary" id="closeTeacher">Return to Game</button>`;
  document.getElementById('masterTrack').onchange = e => {
    state.trackEnabled = e.target.checked;
    document.querySelectorAll('[data-track]').forEach(cb => cb.checked = state.trackEnabled);
  };
  document.getElementById('trackingList').addEventListener('change', e => {
    if(e.target.matches('[data-track]')){
      const all = [...document.querySelectorAll('[data-track]')];
      state.trackEnabled = all.some(cb=>cb.checked);
      document.getElementById('masterTrack').checked = state.trackEnabled;
    }
  });
  document.getElementById('closeTeacher').onclick = () => {
    if(state.completed >= GAME.scenarios.length) renderResults();
    else if(state.name) renderScenario();
    else renderWelcome();
  };
}

function resetGame(){
  state.name="";
  state.scenarioIndex=0;
  state.currentRetries=0;
  state.firstAttemptCorrect=0;
  state.retryScenarioIds=[];
  state.completed=0;
  state.scores={regulation:0,communication:0,independence:0,problemSolving:0};
  state.trackCounts={askedBreak:0,askedHelp:0,appropriateCommunication:0,safeResponse:0,createdSpace:0};
  state.challengeStep=0;
  state.challengeRetries=0;
  state.inChallenge=false;
  renderWelcome();
}

teacherOpenBtn.onclick = renderTeacherSettings;
renderWelcome();
</script>
</body>
</html>
